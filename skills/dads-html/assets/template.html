<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ページタイトル｜サイト名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
<!-- dads:assets -->
<style>
  /* ページ固有のレイアウト。色・影・フォントは global.css のトークンを使う */
  body {
    margin: 0;
    color: var(--color-neutral-solid-gray-800);
    background-color: var(--color-neutral-white);
  }

  .l-container {
    box-sizing: border-box;
    max-width: calc(1120 / 16 * 1rem);
    margin-inline: auto;
    padding-inline: calc(16 / 16 * 1rem);
  }

  @media (min-width: 48rem) {
    .l-container {
      padding-inline: calc(32 / 16 * 1rem);
    }
  }

  .page-header {
    border-bottom: 1px solid var(--color-neutral-solid-gray-200);
  }

  .page-main {
    padding-block: calc(40 / 16 * 1rem) calc(64 / 16 * 1rem);
  }

  .page-footer {
    padding-block: calc(32 / 16 * 1rem);
    background-color: var(--color-neutral-solid-gray-50);
  }
</style>
</head>
<body>

<header class="page-header">
  <div class="l-container">
    <!-- サイト名・ナビゲーション -->
  </div>
</header>

<main class="page-main">
  <div class="l-container">
    <h1 class="dads-u-std-36B-140">ページタイトル</h1>
    <p class="dads-u-std-16N-175">本文</p>
  </div>
</main>

<footer class="page-footer">
  <div class="l-container">
    <p class="dads-u-dns-14N-130">フッター</p>
  </div>
</footer>

</body>
</html>
